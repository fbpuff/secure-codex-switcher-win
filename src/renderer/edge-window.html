<!doctype html>
<html lang="zh-CN" data-docked="true">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex 剩余额度</title>
    <link rel="stylesheet" href="./edge-window.css" />
  </head>
  <body>
    <main class="edge-panel">
      <header class="account-strip">
        <div class="account-block"><small>当前账号</small><strong id="current-account">—</strong></div>
        <button id="switch-account" type="button">立即切换</button>
        <div class="account-block next"><small>下一个账号</small><strong id="next-account">—</strong></div>
        <div class="window-controls">
          <span class="drag-grip" id="drag-grip" title="按住顶部任意非按钮区域拖动实时窗">拖动窗口</span>
          <label class="auto-hide-control"><input id="auto-hide-window" type="checkbox" />自动收起</label>
        </div>
      </header>

      <div class="edge-content" id="edge-content">
        <section class="quota-grid" aria-label="Codex 剩余额度">
          <article class="quota-meter" id="five-hour-meter" role="button" tabindex="0" aria-label="查看当前账号 5 小时周期 token">
            <div class="liquid-wrap"><canvas width="260" height="260" aria-label="5 小时额度"></canvas><div class="liquid-label"><strong>—</strong><span>官方剩余</span><em>额度不足</em></div></div>
            <b>5 小时</b><time>预计重置：—</time><small class="token-detail" id="five-hour-tokens">点击查看本周期 token</small>
          </article>
          <article class="quota-meter" id="one-week-meter" role="button" tabindex="0" aria-label="查看当前账号 7 天周期 token">
            <div class="liquid-wrap"><canvas width="260" height="260" aria-label="7 天额度"></canvas><div class="liquid-label"><strong>—</strong><span>官方剩余</span><em>额度不足</em></div></div>
            <b>7 天</b><time>预计重置：—</time><small class="token-detail" id="one-week-tokens">点击查看本周 token</small>
          </article>
        </section>

        <section class="task-section"><header><strong>正在进行</strong><span id="active-count">0 个项目</span></header><div id="active-tasks" class="task-list"></div></section>
        <section class="task-section"><header><strong>最近完成</strong><span id="completed-count">0 个项目</span></header><div id="completed-tasks" class="task-list"></div></section>
        <p id="status" role="status" aria-live="polite"></p>
      </div>
    </main>
    <script type="module" src="./edge-window.js"></script>
  </body>
</html>
